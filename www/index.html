<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AC Tech Pro — AC Error Code Lookup</title>
  <meta name="description" content="Fast offline lookup of air conditioner error codes, diagnosis and repair checks." />
  <meta name="theme-color" content="#121212" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <img src="icon-192.png" alt="AC Tech Pro" class="logo" />
      <div>
        <h1>AC Tech Pro</h1>
        <p>Error code lookup &middot; works offline</p>
      </div>
    </div>
  </header>

  <main class="app-main" id="tabError">

    <!-- Screen 1: brand -->
    <section id="screenBrand">
      <h2 class="section-title">Select brand</h2>
      <div id="brandGrid" class="brand-grid"></div>
    </section>

    <!-- Screen 2: series (only for brands that have series) -->
    <section id="screenSeries" hidden>
      <h2 class="section-title">Brand: <span id="seriesBrandName" class="accent"></span></h2>
      <h2 class="section-title">Select series</h2>
      <div id="seriesGrid" class="series-grid"></div>
    </section>

    <!-- Screen 3: error code -->
    <section id="screenCode" hidden>
      <h2 class="section-title">Brand: <span id="brandName" class="accent"></span></h2>
      <h2 id="seriesLine" class="section-title" hidden>Series: <span id="seriesName" class="accent"></span></h2>

      <input id="codeInput" class="code-input" type="search" autocomplete="off"
             autocapitalize="characters" spellcheck="false" enterkeyhint="search"
             placeholder="Enter error code, e.g. E1" />

      <div id="output"></div>
    </section>

    <p class="disclaimer">
      Diagnostic reference only. Always verify with the official service manual for the exact model before repair.
    </p>
  </main>

  <main class="app-main" id="tabHome" hidden>
    <h2 class="home-title">How an AC works</h2>
    <div class="home-bar"><button id="homePlay" class="home-btn" type="button">&#9654; Play</button><button id="homeRestart" class="home-btn sec" type="button">&#8635; Restart</button></div>
    <svg id="acSvg" class="home-svg" viewBox="0 0 360 590" role="img" aria-label="Animated refrigeration cycle of a split AC">
<defs>
<linearGradient id="gu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5fa"/><stop offset="1" stop-color="#b9c4d2"/></linearGradient>
<linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#14306e"/><stop offset=".5" stop-color="#3b6fd8"/><stop offset="1" stop-color="#0c1c44"/></linearGradient>
<radialGradient id="mg"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".9"/><stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="320"><stop offset="0" stop-color="#d6f6ff"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="ct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
</defs>
<path id="tint" d="M66 104H294L332 320H28z" fill="url(#ct)"/>
<rect x="50" y="6" width="260" height="96" rx="14" fill="url(#gu)"/>
<rect x="60" y="22" width="240" height="54" rx="8" fill="#0b1524"/>
<g id="ev"><rect x="66" y="30" width="130" height="40" rx="4" fill="#1d5fd6"/><path d="M70 50H192" stroke="#8fd0ff" stroke-width="40" stroke-dasharray="2 6" opacity=".6"/></g>
<circle cx="250" cy="49" r="22" fill="#1a2535" stroke="#6b7a90"/>
<g transform="translate(250 49)"><path class="spin2" d="M0 0L17 0M0 0L8 15M0 0L-8 15M0 0L-17 0M0 0L-8-15M0 0L8-15" stroke="#9fb0c8" stroke-width="4" stroke-linecap="round"/></g>
<rect id="lv" x="70" y="94" width="220" height="6" rx="3" fill="#cfd8e4"/>
<g id="air"><path class="ai" stroke="url(#ag)" d="M94 104Q80 210 66 320"/><path class="ai" stroke="url(#ag)" d="M126 104Q117 210 109 320"/><path class="ai" stroke="url(#ag)" d="M158 104Q155 210 152 320"/><path class="ai" stroke="url(#ag)" d="M194 104Q197 210 200 320"/><path class="ai" stroke="url(#ag)" d="M226 104Q234 210 242 320"/><path class="ai" stroke="url(#ag)" d="M258 104Q271 210 285 320"/></g>
<g id="ms"><ellipse class="m" cx="100" cy="120" rx="24" ry="10" fill="url(#mg)" style="animation-delay:0.0s"/><ellipse class="m" cx="138" cy="120" rx="24" ry="10" fill="url(#mg)" style="animation-delay:-0.6s"/><ellipse class="m" cx="176" cy="120" rx="24" ry="10" fill="url(#mg)" style="animation-delay:-1.2s"/><ellipse class="m" cx="214" cy="120" rx="24" ry="10" fill="url(#mg)" style="animation-delay:-1.8s"/><ellipse class="m" cx="252" cy="120" rx="24" ry="10" fill="url(#mg)" style="animation-delay:-0.3s"/></g>
<g transform="translate(0 70)">
<rect x="40" y="290" width="280" height="210" rx="14" fill="url(#gu)"/>
<rect x="50" y="302" width="260" height="186" rx="8" fill="#0b1524"/>
<rect x="146" y="318" width="92" height="150" rx="4" fill="#2a1410"/>
<circle cx="280" cy="396" r="34" fill="#1a2535" stroke="#6b7a90" stroke-width="2"/>
<g transform="translate(280 396) scale(.8)"><g class="spin1" fill="#9fb0c8"><path d="M0 0q10-20 2-40q-16 14-2 40z"/><path d="M0 0q10-20 2-40q-16 14-2 40z" transform="rotate(72)"/><path d="M0 0q10-20 2-40q-16 14-2 40z" transform="rotate(144)"/><path d="M0 0q10-20 2-40q-16 14-2 40z" transform="rotate(216)"/><path d="M0 0q10-20 2-40q-16 14-2 40z" transform="rotate(288)"/></g></g>
<circle cx="280" cy="396" r="6" fill="#5b6b82"/>
<rect id="cp" x="58" y="330" width="56" height="130" rx="24" fill="url(#gc)"/>
</g>
<g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<path d="M66 50H24V510H60" stroke="#2f7bff"/>
<path d="M114 522H156" stroke="#ef2b2b"/>
<path d="M156 522H228V498H156V474H228V450H156V426H228V402" stroke="#ff5a1f"/>
<path d="M228 402V382H336V234" stroke="#ffa21a"/>
<path d="M336 210V86H130V68" stroke="#5cc8ff"/>
</g>
<path id="f1" class="fl" d="M114 522H156"/>
<path id="f2" class="fl" d="M156 522H228V498H156V474H228V450H156V426H228V402"/>
<path id="f3" class="fl" d="M228 402V382H336V234"/>
<path id="f4" class="fl" d="M336 210V86H130V68"/>
<path id="f5" class="fl" d="M66 50H24V510H60"/>
<g id="vp"><rect x="328" y="212" width="16" height="22" rx="3" fill="#d4a017"/><rect x="324" y="219" width="24" height="8" rx="3" fill="#f2c94c"/></g>
<g class="lb" id="lb"></g>
</svg>
  </main>
  <main class="app-main" id="tabCalc" hidden><h2 class="section-title">HVAC Calculators</h2><p class="msg">Coming soon.</p></main>
  <main class="app-main" id="tabSettings" hidden><h2 class="section-title">Settings</h2><p class="msg">Coming soon.</p></main>

  <!-- Bottom back bar (series and code screens) -->
  <nav id="bottomBar" class="bottom-bar" hidden>
    <button id="bottomBack" class="bottom-back" type="button">&#128281; Back</button>
  </nav>

  <!-- Flow chart viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar"><span class="viewer-title">Flow chart</span></div>
    <div class="viewer-scroll"><img id="viewerImg" alt="Flow chart" /></div>
    <div class="viewer-bottom">
      <button id="zoomOut" type="button" class="viewer-btn">&minus;</button>
      <button id="zoomIn" type="button" class="viewer-btn">+</button>
      <button id="viewerClose" type="button" class="viewer-btn back">&#128281; Back</button>
    </div>
  </div>

  <nav id="tabBar" class="tab-bar" aria-label="Main tabs">
    <button type="button" data-tab="home">Home</button>
    <button type="button" data-tab="error" class="on" aria-current="page">Error Codes</button>
    <button type="button" data-tab="calc">HVAC Calculators</button>
    <button type="button" data-tab="settings">Settings</button>
  </nav>

  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
