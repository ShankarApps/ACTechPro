<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AC Tech Pro — AC Error Code Lookup</title>
  <meta name="description" content="Fast offline lookup of air conditioner error codes, diagnosis and repair checks." />
  <meta name="theme-color" content="#121212" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <img src="icon-192.png" alt="AC Tech Pro" class="logo" />
      <div>
        <h1>AC Tech Pro</h1>
        <p>Error code lookup &middot; works offline</p>
      </div>
    </div>
  </header>

  <main class="app-main" id="tabError">

    <!-- Screen 1: brand -->
    <section id="screenBrand">
      <h2 class="section-title">Select brand</h2>
      <div id="brandGrid" class="brand-grid"></div>
    </section>

    <!-- Screen 2: series (only for brands that have series) -->
    <section id="screenSeries" hidden>
      <h2 class="section-title">Brand: <span id="seriesBrandName" class="accent"></span></h2>
      <h2 class="section-title">Select series</h2>
      <div id="seriesGrid" class="series-grid"></div>
    </section>

    <!-- Screen 3: error code -->
    <section id="screenCode" hidden>
      <h2 class="section-title">Brand: <span id="brandName" class="accent"></span></h2>
      <h2 id="seriesLine" class="section-title" hidden>Series: <span id="seriesName" class="accent"></span></h2>

      <input id="codeInput" class="code-input" type="search" autocomplete="off"
             autocapitalize="characters" spellcheck="false" enterkeyhint="search"
             placeholder="Enter error code, e.g. E1" />

      <div id="output"></div>
    </section>

    <p class="disclaimer">
      Diagnostic reference only. Always verify with the official service manual for the exact model before repair.
    </p>
  </main>

  <main class="app-main" id="tabHome" hidden>
    <div id="stage">
      <img id="imA" src="images/home-cutaway.webp" alt="Split AC cutaway: indoor and outdoor unit with refrigerant pipes">
      <img id="imB" src="images/home-exterior.webp" alt="">
      <div id="remote" class="rm" aria-label="AC remote">
        <div class="rm-lcd"><span class="rm-on"><b>24&deg;C</b><i>COOL</i><i>FAN</i><i>AUTO</i></span><span class="rm-off"><b>OFF</b></span></div>
        <button id="rmPower" class="rm-pw" type="button" aria-label="Power on or off"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8M6.5 6.5a8 8 0 1 0 11 0"/></svg></button>
      </div>
      <svg id="acSvg" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<defs>
<radialGradient id="gr"><stop offset="0" stop-color="#ff3b30" stop-opacity=".7"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
<radialGradient id="go"><stop offset="0" stop-color="#ff9500" stop-opacity=".6"/><stop offset="1" stop-color="#ff9500" stop-opacity="0"/></radialGradient>
<radialGradient id="gy"><stop offset="0" stop-color="#ffd60a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#2f9bff" stop-opacity=".65"/><stop offset="1" stop-color="#2f9bff" stop-opacity="0"/></radialGradient>
<radialGradient id="mg"><stop offset="0" stop-color="#bfefff" stop-opacity=".85"/><stop offset="1" stop-color="#bfefff" stop-opacity="0"/></radialGradient>
<linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="830"><stop offset="0" stop-color="#e3f8ff"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="ct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
</defs>
<g id="air"><path d="M150 570H730L810 850H70z" fill="url(#ct)"/><path class="ai" stroke="url(#ag)" d="M170 560Q116 700 35 830"/><path class="ai" stroke="url(#ag)" d="M278 560Q245 700 197 830"/><path class="ai" stroke="url(#ag)" d="M386 560Q375 700 359 830"/><path class="ai" stroke="url(#ag)" d="M494 560Q504 700 521 830"/><path class="ai" stroke="url(#ag)" d="M602 560Q634 700 683 830"/><path class="ai" stroke="url(#ag)" d="M710 560Q764 700 845 830"/><g id="ms"><ellipse class="m" cx="220" cy="610" rx="70" ry="28" fill="url(#mg)" style="animation-delay:0s"/><ellipse class="m" cx="340" cy="610" rx="70" ry="28" fill="url(#mg)" style="animation-delay:-0.6s"/><ellipse class="m" cx="460" cy="610" rx="70" ry="28" fill="url(#mg)" style="animation-delay:-1.2s"/><ellipse class="m" cx="580" cy="610" rx="70" ry="28" fill="url(#mg)" style="animation-delay:-1.8s"/><ellipse class="m" cx="700" cy="610" rx="70" ry="28" fill="url(#mg)" style="animation-delay:-0.3s"/></g></g>
<g class="gl" id="gCp"><ellipse cx="722" cy="1130" rx="110" ry="150" fill="url(#gr)"/></g>
<g class="gl" id="gCo"><ellipse cx="335" cy="1110" rx="250" ry="200" fill="url(#go)"/></g>
<g class="gl" id="gVa"><circle cx="595" cy="1165" r="75" fill="url(#gy)"/></g>
<g class="gl" id="gEv"><ellipse cx="482" cy="408" rx="270" ry="110" fill="url(#gb)"/></g>
<g class="gl" id="gBl"><circle cx="172" cy="400" r="105" fill="url(#gb)"/></g>
<path id="flL" class="fl" d="M868 1164H910Q939 1164 939 1130V470Q939 433 905 433H878"/><path id="flS" class="fl" d="M878 472H895Q908 472 908 500V1085Q908 1124 880 1124H866"/>
<g class="fd" id="fdA" transform="translate(332 1108)"></g>
<g class="fd" id="fdB" transform="translate(322 1130)"></g>
<g class="fd" id="fdC" transform="translate(172 400)"></g>
<g class="lb" id="lb"></g>
</svg>
    </div>
  </main>
  <main class="app-main" id="tabCalc" hidden><h2 class="section-title">HVAC Calculators</h2><p class="msg">Coming soon.</p></main>
  <main class="app-main" id="tabSettings" hidden><h2 class="section-title">Settings</h2><p class="msg">Coming soon.</p></main>

  <!-- Bottom back bar (series and code screens) -->
  <nav id="bottomBar" class="bottom-bar" hidden>
    <button id="bottomBack" class="bottom-back" type="button">&#128281; Back</button>
  </nav>

  <!-- Flow chart viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar"><span class="viewer-title">Flow chart</span></div>
    <div class="viewer-scroll"><img id="viewerImg" alt="Flow chart" /></div>
    <div class="viewer-bottom">
      <button id="zoomOut" type="button" class="viewer-btn">&minus;</button>
      <button id="zoomIn" type="button" class="viewer-btn">+</button>
      <button id="viewerClose" type="button" class="viewer-btn back">&#128281; Back</button>
    </div>
  </div>

  <nav id="tabBar" class="tab-bar" aria-label="Main tabs">
    <button type="button" data-tab="home">Home</button>
    <button type="button" data-tab="error" class="on" aria-current="page">Error Codes</button>
    <button type="button" data-tab="calc">HVAC Calculators</button>
    <button type="button" data-tab="settings">Settings</button>
  </nav>

  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
