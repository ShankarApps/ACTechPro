<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AC Tech Pro — AC Error Code Lookup</title>
  <meta name="description" content="Fast offline lookup of air conditioner error codes, diagnosis and repair checks." />
  <meta name="theme-color" content="#121212" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <img src="icon-192.png" alt="AC Tech Pro" class="logo" />
      <div>
        <h1>AC Tech Pro</h1>
        <p>Error code lookup &middot; works offline</p>
      </div>
    </div>
  </header>

  <main class="app-main">

    <!-- Screen 1: brand -->
    <section id="screenBrand">
      <h2 class="section-title">Select brand</h2>
      <div id="brandGrid" class="brand-grid"></div>
    </section>

    <!-- Screen 2: series (only for brands that have series) -->
    <section id="screenSeries" hidden>
      <button id="backSeries" class="back-btn" type="button">&larr; Change brand</button>
      <h2 class="section-title">Brand: <span id="seriesBrandName" class="accent"></span></h2>
      <h2 class="section-title">Select series</h2>
      <div id="seriesGrid" class="series-grid"></div>
    </section>

    <!-- Screen 3: error code -->
    <section id="screenCode" hidden>
      <button id="backCode" class="back-btn" type="button">&larr; Back</button>
      <h2 class="section-title">Brand: <span id="brandName" class="accent"></span></h2>
      <h2 id="seriesLine" class="section-title" hidden>Series: <span id="seriesName" class="accent"></span></h2>

      <input id="codeInput" class="code-input" type="search" autocomplete="off"
             autocapitalize="characters" spellcheck="false"
             placeholder="Enter error code, e.g. E1" />

      <div id="output"></div>
    </section>

    <p class="disclaimer">
      Diagnostic reference only. Always verify with the official service manual for the exact model before repair.
    </p>
  </main>

  <!-- Flow chart viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <span class="viewer-title">Flow chart</span>
      <button id="zoomOut" type="button" class="viewer-btn">&minus;</button>
      <button id="zoomIn" type="button" class="viewer-btn">+</button>
      <button id="viewerClose" type="button" class="viewer-btn close">Close</button>
    </div>
    <div class="viewer-scroll"><img id="viewerImg" alt="Flow chart" /></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
